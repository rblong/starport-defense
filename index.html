<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#050814" />
    <meta name="description" content="星港防线 · Starport Defense — a Phaser 4 tower defense mini-game." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>星港防线 · Starport Defense</title>
    <style>
      :root {
        color-scheme: dark;
        --void: #050814;
        --void-2: #080d1d;
        --cyan: #39e7ff;
        --text: #eaf6ff;
        --muted: #8fa6c4;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background:
          radial-gradient(ellipse at 50% 45%, rgba(30, 57, 110, 0.32), transparent 58%),
          radial-gradient(ellipse at 12% 92%, rgba(255, 79, 216, 0.1), transparent 42%),
          linear-gradient(145deg, var(--void-2), var(--void) 58%);
        color: var(--text);
        font-family: "Inter", "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        opacity: 0.35;
        background:
          radial-gradient(ellipse at 18% 22%, rgba(64, 34, 96, 0.2), transparent 48%),
          radial-gradient(ellipse at 82% 82%, rgba(16, 72, 92, 0.18), transparent 44%);
      }

      #ambient {
        position: fixed;
        inset: 0;
        z-index: 0;
        display: block;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      #game {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #game canvas {
        display: block;
        max-width: 100%;
        max-height: 100%;
        touch-action: none;
        filter: drop-shadow(0 0 32px rgba(20, 92, 150, 0.16));
      }

      #boot-message {
        position: fixed;
        inset: 0;
        z-index: 5;
        display: flex;
        flex-direction: column;
        gap: 16px;
        align-items: center;
        justify-content: center;
        letter-spacing: 0.18em;
        color: var(--muted);
        font-size: 13px;
        transition: opacity 0.35s ease;
        pointer-events: none;
      }

      #boot-message strong {
        color: var(--cyan);
        font-size: 16px;
        letter-spacing: 0.32em;
        font-weight: 500;
      }

      #fatal-message {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 20;
        padding: 32px;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        text-align: center;
        background: rgba(5, 8, 20, 0.96);
      }

      #fatal-message h1 {
        margin: 0;
        color: var(--cyan);
        font-size: 24px;
        font-weight: 500;
        letter-spacing: 0.08em;
      }

      #fatal-message p {
        max-width: 560px;
        margin: 0;
        color: var(--muted);
        line-height: 1.7;
        font-size: 14px;
      }

      #rotate-overlay {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 15;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: rgba(5, 8, 20, 0.94);
        text-align: center;
      }

      #rotate-overlay .phone {
        width: 42px;
        height: 68px;
        border: 2px solid var(--cyan);
        border-radius: 9px;
        box-shadow: 0 0 24px rgba(57, 231, 255, 0.25);
        animation: rotate-phone 2.4s ease-in-out infinite;
      }

      #rotate-overlay span {
        color: var(--muted);
        font-size: 14px;
        letter-spacing: 0.12em;
      }

      @keyframes rotate-phone {
        0%,
        28% {
          transform: rotate(0deg);
        }
        68%,
        100% {
          transform: rotate(90deg);
        }
      }

      @media (orientation: portrait) and (max-width: 900px) {
        #rotate-overlay {
          display: flex;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #rotate-overlay .phone {
          animation: none;
          transform: rotate(90deg);
        }
      }
    </style>
  </head>
  <body>
    <canvas id="ambient" aria-hidden="true"></canvas>
    <div id="game"></div>
    <div id="boot-message">
      <strong>星港防线</strong>
      <span>正在建立量子链路…</span>
    </div>
    <div id="fatal-message" role="alert">
      <h1>无法启动渲染器</h1>
      <p>本游戏需要支持 WebGL2 的浏览器。请使用最新版 Chrome、Edge、Firefox 或 Safari，并确认已开启硬件加速。</p>
    </div>
    <div id="rotate-overlay">
      <div class="phone"></div>
      <span>请横屏游玩</span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
